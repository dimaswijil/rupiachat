plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.rupiachat"
    compileSdk = 35
    compileSdkVersion = 35
    ndkVersion = "26.1.10909125"

    compileOptions {
        // Wajib untuk mendukung API Java 8+ di Android versi lama (minSdk 23)
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.rupiachat"
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // MultiDex wajib karena app punya banyak dependency (Firebase, Midtrans, Agora, dll)
        // Tanpa ini, class bisa tidak ditemukan di runtime (ClassNotFoundException)
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Mencegah error "Duplicate META-INF" saat build
    packagingOptions {
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE.md'
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Gson — dibutuhkan oleh Midtrans SDK secara internal.
    // HARUS pakai 'api' (bukan 'implementation') agar class Gson terlihat
    // oleh semua module termasuk Midtrans plugin.
    // Tanpa ini → crash: ClassNotFoundException: com.google.gson.internal.bind.DateTypeAdapter
    api 'com.google.code.gson:gson:2.10.1'
}
